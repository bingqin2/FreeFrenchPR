<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free French course from zero to TCF Canada: lessons, flashcards with spaced repetition, listening and reading practice A1–C2, writing and speaking tasks, mock exams and Canadian PR guides." />
    <meta name="theme-color" content="#2f5bea" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>FreeFrenchPR — Free French for Canada PR</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('ffpr:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
        if (s.lang === 'zh') document.documentElement.lang = 'zh-CN';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
